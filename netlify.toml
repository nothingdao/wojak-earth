[build]
command = "npm run build"
functions = "netlify/functions"
publish = "dist"

[dev]
command = "npm run dev"
targetPort = 5173
autoLaunch = false

[functions]
node_bundler = "esbuild"
external_node_modules = ["@supabase/supabase-js"]

[build.environment]
NODE_VERSION = "18"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[redirects]]
from = "/player/:id"
to = "/.netlify/functions/metadata/:id"
status = 200
